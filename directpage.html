<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Development Cell — Thought for the Day</title><style>:root{--ink:#e9eef8;--muted:#8e9db9;--accent:#e8c98a}*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 700px at 50% -10%,#17213c 0%,#0b1020 45%,#05070e 100%);display:grid;place-items:center;-webkit-font-smoothing:antialiased}#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}body::after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(62% 62% at 50% 45%,rgba(0,0,0,0) 35%,rgba(3,5,12,.88) 100%)}.stage{position:relative;z-index:2;width:min(860px,90vw);padding:6vh 0;text-align:center;transition:opacity .45s ease,transform .45s ease}html.leaving .stage{opacity:0;transform:translateY(-10px)}.eyebrow{margin:0 0 clamp(1.6rem,4.5vh,2.8rem);font-size:clamp(.62rem,1.6vw,.74rem);letter-spacing:.32em;text-transform:uppercase;font-weight:500;color:var(--muted)}.quote{margin:0;font-family:Georgia,"Iowan Old Style","Palatino Linotype","Times New Roman",serif;font-size:clamp(1.35rem,4.2vw,2.5rem);line-height:1.42;text-wrap:balance;text-shadow:0 1px 34px rgba(0,0,0,.6)}.quote .line{display:block}.past{color:var(--muted);font-style:italic}.potential{position:relative;display:inline-block;color:var(--accent);font-style:italic}.potential::after{content:"";position:absolute;left:0;right:0;bottom:-.06em;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);transform:scaleX(0);transform-origin:center;animation:underline 1.1s 1.15s cubic-bezier(.2,.8,.2,1) forwards}.timer{position:relative;width:84px;height:84px;margin:clamp(2rem,6vh,3rem) auto 1.1rem;display:grid;place-items:center}.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.ring-track{fill:none;stroke:rgba(150,175,220,.16);stroke-width:2}.ring-fill{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}.count{font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.02em}.hint{margin:0;font-size:clamp(.72rem,2vw,.82rem);letter-spacing:.1em;color:var(--muted)}@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes underline{to{transform:scaleX(1)}}.eyebrow{animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) both}.line:nth-child(1){animation:rise .9s .40s cubic-bezier(.2,.7,.2,1) both}.line:nth-child(2){animation:rise .9s .62s cubic-bezier(.2,.7,.2,1) both}.timer{animation:rise .9s .90s cubic-bezier(.2,.7,.2,1) both}.hint{animation:rise .9s 1.10s cubic-bezier(.2,.7,.2,1) both}@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-delay:0s!important}.potential::after{transform:scaleX(1)}}</style></head><body><canvas id="bg" aria-hidden="true"></canvas><main class="stage"><p class="eyebrow">Never give up &middot; Never Stop</p><blockquote class="quote"><span class="line">Do not compare yourself with your <span class="past">past</span>,</span><span class="line">compare yourself with your <span class="potential">potential</span>.</span></blockquote><div class="timer" role="timer" aria-label="Redirecting countdown"><svg class="ring" viewBox="0 0 80 80" aria-hidden="true"><circle class="ring-track" cx="40" cy="40" r="34"></circle><circle class="ring-fill" id="ringFill" cx="40" cy="40" r="34"></circle></svg><span class="count" id="count">5</span></div><p class="hint">Redirecting you to the orientation video on YouTube&hellip;</p></main><script>(function(){const c=document.getElementById('bg'),x=c.getContext('2d'),r=window.matchMedia('(prefers-reduced-motion: reduce)').matches;const L=130,m={x:-1e4,y:-1e4};let W=0,H=0,dpr=1,p=[];function b(){const t=Math.round((W*H)/15000),n=Math.max(26,Math.min(r?40:110,t));p=[];fo nt=Math.ceil(rem/1000)||0;const pr=Math.min(1,el/D);rf.style.strokeDashoffset=C*(1-pr);if(rem<=0){go();return}requestAnimationFrame(fr)}requestAnimationFrame(fr);setTimeout(go,D+60)})();</script></body></html>
